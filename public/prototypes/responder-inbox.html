<script>
// THROWAWAY HTML PROTOTYPE. Three inbox structures; ?variant=A|B|C. No backend, no real sends.
const paths={spark:'<path d="m12 3 2.7 6.3L21 12l-6.3 2.7L12 21l-2.7-6.3L3 12l6.3-2.7Z"/>',search:'<circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 4.5 4.5"/>',filter:'<path d="M4 6h16M7 12h10M10 18h4"/>',check:'<path d="m5 12 4 4L19 6"/>',double:'<path d="m2 12 4 4L16 6m-5 8 2 2L23 6"/>',arrow:'<path d="m9 5 7 7-7 7"/>',left:'<path d="m15 5-7 7 7 7"/>',send:'<path d="m21 3-7 18-4-7-7-4 18-7ZM10 14 21 3"/>',more:'<circle cx="5" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/>',info:'<circle cx="12" cy="12" r="9"/><path d="M12 11v6m0-10v.1"/>',clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',chat:'<path d="M20 11.5a8.5 8.5 0 0 1-8.5 8.5H4l1.2-4A8.5 8.5 0 1 1 20 11.5Z"/><path d="M8 11h8m-8 4h5"/>',web:'<circle cx="12" cy="12" r="9"/><ellipse cx="12" cy="12" rx="4" ry="9"/><path d="M3 12h18"/>',wa:'<path d="M21 11.5a9 9 0 0 1-9 9c-1.6 0-3.1-.4-4.4-1.1L3 21l1.5-4.6A9 9 0 1 1 21 11.5Z"/><path d="M8 7.5c0 5 3.5 8.5 8.5 8.5l1-2-3-1-1 1c-1.8-.7-3.1-2-3.8-3.8l1-1-1-3-1.7 1.3Z"/>',line:'<path d="M21 10c0 5-5 8-10 9l-1 2-1-3c-4-1-6-4-6-8a9 7 0 0 1 18 0Z"/><path d="M7 10h10"/>',ig:'<rect x="4" y="4" width="16" height="16" rx="5"/><circle cx="12" cy="12" r="4"/><path d="M17 7h.1"/>',fb:'<path d="M14 21v-9h3l1-4h-4V6c0-1 1-2 2-2h2V1h-3c-3 0-5 2-5 5v2H7v4h3v9"/>',archive:'<path d="M4 8h16v12H4zM3 4h18v4H3zM9 12h6"/>',bot:'<rect x="4" y="7" width="16" height="13" rx="4"/><path d="M12 3v4M8 12v2m8-2v2m-7 3h6M1 11v5m22-5v5"/>',hand:'<path d="M7 12V5a2 2 0 0 1 4 0v6-8a2 2 0 0 1 4 0v8-6a2 2 0 0 1 4 0v9l-2 6H8l-5-8a2 2 0 0 1 3-2l1 2"/>',reopen:'<path d="M4 9a8 8 0 1 1 0 6M4 3v6h6"/>',close:'<path d="m6 6 12 12M6 18 18 6"/>',bookmark:'<path d="M6 3h12v18l-6-4-6 4V3Z"/>',inbox:'<path d="m4 4-2 12v4h20v-4L20 4H4Zm-2 12h6l2 3h4l2-3h6"/>',building:'<path d="M5 21V3h14v18M3 21h18M9 7h1m4 0h1M9 11h1m4 0h1M10 21v-6h4v6"/>',help:'<circle cx="12" cy="12" r="9"/><path d="M9 9a3 3 0 1 1 5 2c-2 1-2 2-2 3m0 3v.1"/>',list:'<path d="M8 6h13M8 12h13M8 18h13M3 6h.1M3 12h.1M3 18h.1"/>'};
const ico=n=>'<svg viewBox="0 0 24 24" aria-hidden="true">'+(paths[n]||paths.chat)+'</svg>';
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const channels={whatsapp:['WhatsApp','wa'],web:['Web chat','web'],line:['LINE','line'],instagram:['Instagram','ig'],facebook:['Facebook','fb']};
const customers=[
{id:'ananya',name:'Ananya S.',initials:'AS',color:'',channel:'whatsapp',property:'The Garden Villa',time:'4m',status:'open',waiting:true,ai:true,closed:false,topic:'Late check-in',contact:'+66 ••• ••• 4821',messages:[{author:'guest',text:'Hi! We’re arriving on Friday. Is it possible to check in after 9 pm?',time:'14:28'},{author:'ai',text:'Thanks for letting us know. I’m passing your late check-in question to our team.',time:'14:28'},{author:'guest',text:'Our flight lands at 8:30, so we’ll probably get there around 10. Is that okay?',time:'14:32'}]},
{id:'daniel',name:'Daniel W.',initials:'DW',color:'blue',channel:'web',property:'The Garden Villa',time:'8m',status:'open',waiting:true,ai:true,closed:false,topic:'Airport transfer',contact:'daniel@example.com',messages:[{author:'guest',text:'Hello, can you help arrange an airport transfer for two people?',time:'14:28'}]},
{id:'minji',name:'Minji Kim',initials:'MK',color:'lilac',channel:'line',property:'Palm Residence',time:'12m',status:'open',waiting:true,ai:false,closed:false,topic:'Booking change',contact:'LINE · Minji Kim',messages:[{author:'guest',text:'Hi, I need to change my arrival date from October 3 to October 4. Can someone help?',time:'14:24'}]},
{id:'leo',name:'Leo Martin',initials:'LM',color:'sand',channel:'instagram',property:'Palm Residence',time:'18m',status:'open',waiting:false,ai:true,closed:false,topic:'Room availability',contact:'@leo.martin',messages:[{author:'guest',text:'Do you have a room available for next weekend?',time:'14:18'},{author:'ai',text:'What are your check-in and check-out dates, and how many guests will be staying?',time:'14:18'}]},
{id:'ploy',name:'Ploy R.',initials:'PR',color:'rose',channel:'facebook',property:'The Garden Villa',time:'25m',status:'open',waiting:false,ai:false,closed:false,topic:'Parking',contact:'Facebook · Ploy R.',messages:[{author:'guest',text:'Can I park at the property?',time:'14:10'},{author:'staff',text:'Let me confirm the parking arrangements with the property team for you.',time:'14:11'}]},
{id:'mali',name:'Mali T.',initials:'MT',color:'sand',channel:'whatsapp',property:'General site',time:'2d',status:'resolved',waiting:false,ai:false,closed:true,topic:'Previous enquiry',contact:'+66 ••• ••• 0932',messages:[{author:'guest',text:'Thank you for your help. That answers my question!',time:'Sep 28, 09:15'}]},
{id:'ethan',name:'Ethan Park',initials:'EP',color:'blue',channel:'web',property:'Palm Residence',time:'3d',status:'archived',waiting:false,ai:false,closed:false,topic:'Previous enquiry',contact:'ethan@example.com',messages:[{author:'guest',text:'Thanks, everything is sorted now.',time:'Sep 27, 11:30'}]}];
const variants={A:{name:'Calm inbox',title:'Guest inbox',subtitle:'A · Two-pane inbox',hypothesis:'คิวและบทสนทนาอยู่คู่กัน · เหมาะกับงานตอบแชตทั่วไป'},B:{name:'Focus mode',title:'One conversation at a time.',subtitle:'B · Focus mode',hypothesis:'โฟกัสเคสเดียว · ปิดแล้วไปเคสถัดไป · เปิดคิวเมื่อจำเป็น'},C:{name:'Queue desk',title:'Your response queue',subtitle:'C · Queue desk',hypothesis:'ดูภาพรวมเป็นตาราง · เลือกเคสแล้วเปิดแผงตอบด้านข้าง'}};
const q=new URLSearchParams(location.search).get('variant');
let state={variant:variants[q]?q:'A',filter:'waiting',search:'',channel:'all',selected:'ananya',drafts:{},more:false,filters:false,mobileChat:false,deskOpen:false};
let toastTimer,drawerFocus;
const current=()=>customers.find(c=>c.id===state.selected);
function visible(){return customers.filter(c=>(state.filter==='waiting'?c.status==='open'&&c.waiting:state.filter==='open'?c.status==='open':state.filter==='done'?c.status!=='open':state.filter==='archived'?c.status==='archived':true)&&(state.channel==='all'||c.channel===state.channel)&&(c.name+' '+c.property+' '+c.messages.map(m=>m.text).join(' ')).toLowerCase().includes(state.search.toLowerCase()));}
function normalize(){const a=visible();if(!a.some(c=>c.id===state.selected))state.selected=a[0]?.id||null;}
function avatar(c){return '<span class="avatar '+c.color+'">'+c.initials+'<span class="channel-badge">'+ico(channels[c.channel][1])+'</span></span>';}
function badge(c){const label=c.status==='archived'?'Archived':c.status==='resolved'?'Done':c.waiting?'Waiting':c.ai?'AI handling':'Replied';return '<span class="status '+(c.waiting?'waiting':c.status!=='open'?'muted':'')+'">'+(c.waiting?'<span class="dot"></span>':ico(c.status!=='open'?'check':'chat'))+label+'</span>';}
function tabs(){return '<div class="tabs" role="group" aria-label="Conversation queue">'+[['waiting','Waiting'],['open','Open'],['done','Done']].map(([k,l])=>'<button class="tab '+(state.filter===k?'active':'')+'" data-action="filter" data-value="'+k+'" aria-pressed="'+(state.filter===k)+'">'+l+'<span class="count">'+customers.filter(c=>k==='waiting'?c.status==='open'&&c.waiting:k==='open'?c.status==='open':c.status!=='open').length+'</span></button>').join('')+'</div>';}
function search(){return '<div class="searchbar"><label class="search">'+ico('search')+'<input id="search" aria-label="Search conversations" placeholder="Search conversations" value="'+esc(state.search)+'" autocomplete="off"></label><button class="iconbtn" data-action="filters" aria-label="More filters" aria-expanded="'+state.filters+'">'+ico('filter')+'</button></div>';}
function filters(){return state.filters?'<div class="filters"><select aria-label="Conversation status" id="status-filter">'+[['waiting','Waiting'],['open','Open'],['done','Done'],['all','All conversations'],['archived','Archived']].map(([k,l])=>'<option value="'+k+'" '+(state.filter===k?'selected':'')+'>'+l+'</option>').join('')+'</select><select aria-label="Channel" id="channel-filter">'+[['all','All channels'],...Object.entries(channels).map(([k,v])=>[k,v[0]])].map(([k,l])=>'<option value="'+k+'" '+(state.channel===k?'selected':'')+'>'+l+'</option>').join('')+'</select></div>':'';}
function empty(){return '<div class="empty"><span class="empty-symbol">'+ico('inbox')+'</span><h3>'+(state.search?'No matches':state.filter==='waiting'?'You’re all caught up':'No conversations here')+'</h3><p>'+(state.search?'Try a different name or message.':'This queue is clear. Choose another view to continue.')+'</p><button class="btn" data-action="reset">'+(state.search?'Clear search':'Show open conversations')+' '+ico('arrow')+'</button></div>';}
function queue(){const a=visible();return '<aside class="queue" aria-label="Conversation list"><div class="queue-head"><div class="queue-title"><h2>Conversations</h2><button class="iconbtn" data-action="help" aria-label="Inbox help">'+ico('help')+'</button></div>'+tabs()+search()+filters()+'</div><div class="list-meta"><span>'+(state.filter==='waiting'?'Needs your attention':'Recent conversations')+'</span><span>'+a.length+' chats</span></div><div class="chatlist">'+(a.length?a.map(c=>'<button class="contact '+(c.id===state.selected?'selected':'')+'" data-action="select" data-value="'+c.id+'" aria-pressed="'+(c.id===state.selected)+'">'+avatar(c)+'<span class="contact-main"><span class="name-row"><strong>'+c.name+'</strong><span class="time">'+c.time+'</span></span><span class="snippet">'+esc(c.messages.at(-1).text)+'</span><span class="small-meta">'+(c.waiting?'<span class="dot"></span>':'')+c.property+' <span>·</span> '+(c.status!=='open'?c.status==='resolved'?'Done':'Archived':channels[c.channel][0])+'</span></span></button>').join(''):empty())+'</div><div class="queue-bottom">'+ico('check')+' '+customers.filter(c=>c.status!=='open').length+' conversations completed</div></aside>';}
function more(c){return state.more?'<div class="more" aria-label="Conversation actions"><button data-action="details">'+ico('info')+'Contact & details</button><button data-action="ai">'+ico(c.ai?'hand':'bot')+(c.ai?'Take over from AI':'Resume AI replies')+'</button>'+(c.status!=='archived'?'<button data-action="archive">'+ico('archive')+'Archive conversation</button>':'')+'<div class="divider"></div><button data-action="help">'+ico('help')+'Keyboard shortcuts</button></div>':'';}
function message(c,m){const guest=m.author==='guest';return '<article class="message '+(guest?'':'out')+'">'+(guest?'<span class="avatar '+c.color+'">'+c.initials+'</span>':'<span class="avatar">'+(m.author==='ai'?ico('bot'):'NI')+'</span>')+'<div class="msg-stack"><div class="msg-author">'+(guest?c.name:m.author==='ai'?'AI assistant':'You · Nicha')+'</div><div class="bubble">'+esc(m.text)+'</div><div class="msg-meta"><span>'+esc(m.time)+' '+(m.author==='staff'?ico('double'):'')+'</span>'+(guest?'<button class="save" data-action="save" aria-label="Save this message as an answer">'+ico('bookmark')+' Save as answer</button>':'')+'</div></div></article>';}
function composer(c){if(c.closed)return '<div class="composer"><div class="closed" role="status">'+ico('clock')+'<div><strong>WhatsApp reply window has ended</strong><p>Free-text replies are available for 24 hours after the guest’s last message. You can reply when they message again.</p><small>Last guest message: Sep 28 · Template sending unavailable in this preview</small></div></div></div>';return '<form class="composer" id="reply-form"><div class="quick"><span>Quick reply</span><button type="button" data-action="quick" data-value="check">I’ll check for you</button><button type="button" data-action="quick" data-value="details">Ask for details</button></div><div class="input-box"><label class="sr-only" for="reply">Reply to '+c.name+'</label><textarea id="reply" maxlength="1000" placeholder="Write your reply…">'+esc(state.drafts[c.id]||'')+'</textarea><div class="composer-footer"><span class="reply-mode">'+ico(channels[c.channel][1])+channels[c.channel][0]+(c.ai?' · Reply pauses AI':'')+'</span><span class="send-group"><span class="send-hint">Enter to send</span><button type="submit" class="btn send" id="send-btn" '+(!(state.drafts[c.id]||'').trim()?'disabled':'')+'>Send '+ico('send')+'</button></span></div></div></form>';}
function conversation(mode='split'){const c=current();if(!c)return '<section class="conversation">'+empty()+'</section>';return '<section class="conversation" aria-label="Conversation with '+c.name+'"><header class="conv-header"><div class="person">'+(mode==='split'?'<button class="iconbtn mobile-back" data-action="back" aria-label="Back to conversations">'+ico('left')+'</button>':'')+avatar(c)+'<div><h2>'+c.name+'</h2><div class="identity">'+ico(channels[c.channel][1])+'<span>'+channels[c.channel][0]+'</span><span>·</span><span>'+c.property+'</span></div></div></div><div class="actions">'+(c.status==='open'?'<button class="btn primary" data-action="resolve">'+ico('check')+(mode==='focus'?'Resolve & next':'Resolve')+'</button>':'<button class="btn" data-action="reopen">'+ico('reopen')+'Reopen</button>')+'<button class="iconbtn details-btn" data-action="details" aria-label="Contact details">'+ico('info')+'</button><button class="iconbtn" data-action="more" aria-label="More conversation actions" aria-expanded="'+state.more+'">'+ico('more')+'</button>'+(mode==='desk'?'<button class="iconbtn" data-action="close-desk" aria-label="Close conversation panel">'+ico('close')+'</button>':'')+more(c)+'</div></header><div class="ownership"><span>'+ico(c.ai?'bot':c.status==='open'?'hand':'check')+(c.status==='archived'?'Archived conversation':c.status==='resolved'?'Conversation completed':c.ai?'AI is active · Your reply takes over':'You’re replying · AI paused')+'</span>'+badge(c)+'</div><div class="transcript" id="transcript"><div class="date">'+(c.closed?'September 28':'Today · September 30')+'</div><div class="context">'+ico('building')+c.topic+' <span>·</span> '+c.property+'</div>'+c.messages.map(m=>message(c,m)).join('')+'</div>'+composer(c)+'</section>';}
function focus(){const a=visible(),c=current(),i=a.findIndex(x=>x.id===c?.id),next=a[(i+1)%a.length];return '<div class="focus-layout"><div class="focus-strip"><div class="strip-left">'+ico('inbox')+'<strong>'+customers.filter(c=>c.status==='open'&&c.waiting).length+' waiting</strong><span class="subtle">'+(c?(i+1)+' of '+a.length+' in this view':'Queue complete')+'</span></div><div class="strip-right">'+(next&&next.id!==c?.id?'<span>Up next: '+next.name+'</span>':'')+'<button class="btn" data-action="queue">'+ico('list')+'View queue</button></div></div><div class="focus-card">'+conversation('focus')+'</div><p class="focus-caption">Read. Reply. Resolve. The rest is one click away.</p></div>';}
function desk(){const a=visible();return '<div class="desk-layout '+(state.deskOpen&&current()?'detail-open':'')+'"><section class="desk-main" aria-label="Response queue"><div class="desk-toolbar"><div class="desk-heading"><h2>Conversations</h2><span class="queue-summary"><span class="dot"></span>'+customers.filter(c=>c.status==='open'&&c.waiting).length+' need a reply</span></div><div class="desk-controls">'+tabs()+search()+'</div></div>'+filters()+(a.length?'<div class="table-wrap"><table><colgroup><col style="width:'+(state.deskOpen?'42%':'23%')+'"><col class="channel-width" style="width:'+(state.deskOpen?'18%':'14%')+'"><col class="message-width" style="width:36%"><col style="width:'+(state.deskOpen?'16%':'10%')+'"><col style="width:'+(state.deskOpen?'24%':'17%')+'"></colgroup><thead><tr><th>Guest</th><th class="channel-col">Channel</th><th class="message-col">Latest message</th><th>Last msg</th><th>Status</th></tr></thead><tbody>'+a.map(c=>'<tr class="ticket '+(state.deskOpen&&c.id===state.selected?'selected':'')+'" data-action="select" data-value="'+c.id+'" tabindex="0" aria-label="Open conversation with '+c.name+'"><td><div class="customer">'+avatar(c)+'<div><strong>'+c.name+'</strong><small>'+c.property+'</small></div></div></td><td class="channel-td"><span class="channel-cell">'+ico(channels[c.channel][1])+channels[c.channel][0]+'</span></td><td class="message-cell"><div class="preview-text">'+esc(c.messages.at(-1).text)+'</div><small>'+c.topic+'</small></td><td><span class="'+(c.waiting?'wait-time':'')+'">'+(c.time==='now'?'Just now':c.time+' ago')+'</span></td><td>'+badge(c)+'</td></tr>').join('')+'</tbody></table></div><div class="table-footer"><span>'+a.length+' conversations · All loaded</span><span>Click a guest to reply '+ico('arrow')+'</span></div><div class="desk-hint">'+ico('chat')+'Choose a conversation. Your reply panel opens beside the queue.</div>':empty())+'</section>'+(state.deskOpen&&current()?'<aside class="desk-detail">'+conversation('desk')+'</aside>':'')+'</div>';}
function render(){normalize();const v=variants[state.variant];document.body.className='variant-'+state.variant.toLowerCase();document.title=v.name+' · Inbox design preview';document.getElementById('brand-icon').innerHTML=ico('spark');document.getElementById('intro').innerHTML='<h1>'+v.title+'<span>'+v.subtitle+'</span></h1><p class="hypothesis">'+v.hypothesis+'</p>';document.getElementById('workspace').innerHTML=state.variant==='A'?'<div class="split '+(state.mobileChat?'mobile-chat':'')+'">'+queue()+conversation()+'</div>':state.variant==='B'?focus():desk();document.getElementById('switcher').innerHTML='<button class="arrow" data-action="prev" aria-label="Previous design">'+ico('left')+'</button><span class="switch-label">COMPARE</span>'+Object.entries(variants).map(([k,v])=>'<button data-action="variant" data-value="'+k+'" aria-pressed="'+(k===state.variant)+'">'+k+' · '+v.name+'</button>').join('')+'<button class="arrow" data-action="next" aria-label="Next design">'+ico('arrow')+'</button>';const t=document.getElementById('transcript');if(t)t.scrollTop=t.scrollHeight;}
function switchVariant(v){state.variant=v;state.more=false;state.mobileChat=false;state.deskOpen=false;closeOverlay();const u=new URL(location.href);u.searchParams.set('variant',v);history.replaceState(null,'',u);render();}
function toast(s){clearTimeout(toastTimer);const el=document.getElementById('toast');el.className='toast';el.textContent=s;toastTimer=setTimeout(()=>{el.className='';el.textContent=''},3600);}
function closeOverlay(){document.getElementById('overlay').innerHTML='';if(drawerFocus?.isConnected)drawerFocus.focus();drawerFocus=null;}
function openOverlay(html){drawerFocus=document.activeElement;document.getElementById('overlay').innerHTML='<div class="backdrop" data-backdrop="true"><section class="drawer" role="dialog" aria-modal="true" aria-labelledby="drawer-title" tabindex="-1">'+html+'</section></div>';document.querySelector('.drawer').focus();}
function openDetails(){const c=current();if(!c)return;state.more=false;render();openOverlay('<div class="drawer-header"><h2 id="drawer-title">Guest details</h2><button class="iconbtn" data-action="close-overlay" aria-label="Close guest details">'+ico('close')+'</button></div><div class="person">'+avatar(c)+'<div><h2 style="font:600 16px Noto,sans-serif">'+c.name+'</h2><p class="subtle">'+channels[c.channel][0]+'</p></div></div><h3>Contact & context</h3><dl><dt>Contact</dt><dd>'+c.contact+'</dd><dt>Property</dt><dd>'+c.property+'</dd><dt>Topic</dt><dd>'+c.topic+'</dd><dt>Last message</dt><dd>'+c.time+' ago</dd><dt>Reply window</dt><dd>'+(c.closed?'Closed · WhatsApp 24-hour window':'Available in this sample')+'</dd><dt>Handled by</dt><dd>'+(c.ai?'AI assistant':'Nicha · Staff')+'</dd><dt>State</dt><dd>'+badge(c)+'</dd></dl><div class="section"><h3>Technical information</h3><details><summary class="subtle" style="cursor:pointer">Session & delivery</summary><dl style="margin-top:15px"><dt>Session</dt><dd>demo_'+c.id+'</dd><dt>Delivery</dt><dd>Sample only · No live delivery</dd><dt>Presence</dt><dd>'+(c.closed?'Offline':'Unknown')+' · Independent of reply availability</dd></dl></details></div><p class="drawer-note">ข้อมูลติดต่อและ log เปิดดูเมื่อจำเป็น ไม่แย่งพื้นที่บทสนทนา</p>');}
function openQueue(){openOverlay('<div class="drawer-header"><h2 id="drawer-title">Your queue</h2><button class="iconbtn" data-action="close-overlay" aria-label="Close queue">'+ico('close')+'</button></div>'+queue());}
function refreshQueue(){render();if(document.querySelector('.drawer .queue'))openQueue();}
function openHelp(){state.more=false;render();openOverlay('<div class="drawer-header"><h2 id="drawer-title">A little less UI.</h2><button class="iconbtn" data-action="close-overlay" aria-label="Close help">'+ico('close')+'</button></div><h3>Prototype shortcuts</h3><dl><dt>← / →</dt><dd>Compare design variants</dd><dt>Enter</dt><dd>Send a sample reply</dd><dt>Shift + Enter</dt><dd>New line in your reply</dd><dt>Escape</dt><dd>Close details or menu</dd></dl><div class="section"><h3>ลองดูสถานะสำคัญ</h3><p class="subtle">เลือก Done → Mali T. เพื่อดู WhatsApp หมดเวลาตอบ; More filters → Archived เพื่อดูเคสที่เก็บแล้ว. ลองค้นหาคำที่ไม่มีเพื่อดู empty state.</p></div><p class="drawer-note">ข้อมูลจำลอง · การส่ง การปิดเคส และการเปลี่ยน AI มีผลเฉพาะ preview นี้ รีโหลดเพื่อเริ่มใหม่</p>');}
function sendReply(){const c=current(),text=(state.drafts[c?.id]||'').trim();if(!c||c.closed||!text)return;c.messages.push({author:'staff',text,time:new Date().toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'})});c.ai=false;c.waiting=false;c.status='open';c.time='now';state.drafts[c.id]='';if(['waiting','done','archived'].includes(state.filter))state.filter='open';render();toast('Sample reply sent · AI paused for this conversation');document.getElementById('reply')?.focus();}
function action(n,v){const c=current();switch(n){case'variant':switchVariant(v);break;case'prev':case'next':{const a=['A','B','C'];switchVariant(a[(a.indexOf(state.variant)+(n==='next'?1:2))%3]);break;}case'filter':state.filter=v;state.selected=null;state.more=false;state.mobileChat=false;state.deskOpen=false;refreshQueue();break;case'filters':state.filters=!state.filters;refreshQueue();break;case'select':state.selected=v;state.mobileChat=true;state.deskOpen=true;state.more=false;closeOverlay();render();break;case'back':state.mobileChat=false;render();break;case'more':state.more=!state.more;render();break;case'details':openDetails();break;case'close-overlay':closeOverlay();break;case'queue':openQueue();break;case'help':openHelp();break;case'close-desk':state.deskOpen=false;state.more=false;render();break;case'reset':state.search='';state.channel='all';state.filter='open';state.selected=null;refreshQueue();break;case'resolve':if(c){c.status='resolved';c.waiting=false;state.selected=null;state.more=false;normalize();if(!current()){state.mobileChat=false;state.deskOpen=false}render();toast(c.name+' marked done'+(current()?' · Next conversation ready':''));}break;case'reopen':if(c){c.status='open';c.waiting=true;state.filter='waiting';state.more=false;render();toast('Conversation reopened · Reply availability is unchanged');}break;case'archive':if(c){c.status='archived';c.waiting=false;state.selected=null;state.more=false;render();toast(c.name+' archived in this preview');}break;case'ai':if(c){c.ai=!c.ai;state.more=false;render();toast(c.ai?'AI replies resumed in this preview':'You’re replying · AI paused');}break;case'quick':if(c&&!c.closed){state.drafts[c.id]=v==='check'?'Let me check with the property team for you. I’ll get back to you shortly.':'Could you share your booking reference and arrival date so I can check for you?';render();document.getElementById('reply').focus();}break;case'save':toast('Sample message selected · Answer editing belongs in the knowledge workflow');break;}}
document.addEventListener('click',e=>{if(e.target.matches('[data-backdrop]')){closeOverlay();return;}const el=e.target.closest('[data-action]');if(el){action(el.dataset.action,el.dataset.value);return;}if(state.more&&!e.target.closest('.actions')){state.more=false;render();}});
document.addEventListener('input',e=>{if(e.target.id==='reply'){const c=current();if(c)state.drafts[c.id]=e.target.value;document.getElementById('send-btn').disabled=!e.target.value.trim();}if(e.target.id==='search'){state.search=e.target.value;state.selected=null;const pos=e.target.selectionStart;refreshQueue();const input=document.querySelector('.drawer #search')||document.getElementById('search');input?.focus();input?.setSelectionRange(pos,pos);}});
document.addEventListener('change',e=>{if(e.target.id==='status-filter'){state.filter=e.target.value;state.selected=null;state.deskOpen=false;refreshQueue();}if(e.target.id==='channel-filter'){state.channel=e.target.value;state.selected=null;state.deskOpen=false;refreshQueue();}});
document.addEventListener('submit',e=>{if(e.target.id==='reply-form'){e.preventDefault();sendReply();}});
document.addEventListener('keydown',e=>{const editing=e.target.matches('input,textarea,select,[contenteditable=true]');if(e.key==='Escape'){if(document.querySelector('.drawer'))closeOverlay();else if(state.more){state.more=false;render();}return;}if(e.target.id==='reply'&&e.key==='Enter'&&!e.shiftKey&&!e.isComposing){e.preventDefault();sendReply();return;}const drawer=document.querySelector('.drawer');if(drawer&&e.key==='Tab'){const a=[...drawer.querySelectorAll('button,input,select,textarea,summary,[tabindex="0"]')].filter(x=>!x.disabled&&x.offsetParent!==null),first=a[0],last=a.at(-1);if(e.shiftKey&&(document.activeElement===first||document.activeElement===drawer)){e.preventDefault();last?.focus();}else if(!e.shiftKey&&(document.activeElement===last||document.activeElement===drawer)){e.preventDefault();first?.focus();}return;}if(drawer)return;if(!editing&&e.target.closest('tr.ticket')&&['Enter',' '].includes(e.key)){e.preventDefault();action('select',e.target.closest('tr.ticket').dataset.value);return;}if(!editing&&['ArrowLeft','ArrowRight'].includes(e.key)){e.preventDefault();action(e.key==='ArrowLeft'?'prev':'next');}});
render();
</script></body></html>
