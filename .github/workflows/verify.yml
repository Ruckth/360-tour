name: Verify
on:
  push:
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.30.3
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm verify
        env:
          NEXT_PUBLIC_CONVEX_URL: https://example.convex.cloud
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: placeholder
      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium
      # Disconnected demo build: scripts/e2e-server.mjs forces placeholder backend settings and
      # never runs Convex, so this cannot sync or deploy a deployment.
      - name: Browser smoke tests
        run: pnpm test:e2e:smoke
        env:
          CI: 'true'
      - name: Upload Playwright failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14
