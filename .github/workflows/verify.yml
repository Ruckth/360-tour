name: Verify
on:
  push:
    branches: [main, bench/verify-five-minutes-20261122]
  pull_request:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  static:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10.30.3
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm knip
      - run: pnpm arch:score --phase "$(cat .arch-phase)"

  unit:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    env:
      VITEST_MAX_WORKERS: '4'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10.30.3
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Unit, DOM and Convex shard
        run: pnpm test:unit --project unit --project dom --project convex --shard=${{ matrix.shard }}/2
      - name: Serial repository guards (once overall)
        if: matrix.shard == 1
        run: pnpm test:guards
      - name: Verify one durable write per messaging acknowledgement
        if: matrix.shard == 1
        run: pnpm bench:messaging

  components:
    # Booking component suites run against Vite with mocked Clerk and Next: no backend, no credentials.
    runs-on: ubuntu-24.04
    # Match @playwright/test in pnpm-lock.yaml so Chromium and its fonts are present.
    container:
      image: mcr.microsoft.com/playwright:v1.60.0-noble
      options: --ipc=host
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.30.3
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:booking-ui --shard=${{ matrix.shard }}/6

  integration:
    # Forks receive no secrets and fail preflight; a skipped job must not imply verification.
    # No pull_request_target or authenticated artifact upload.
    runs-on: ubuntu-24.04
    # Match @playwright/test in pnpm-lock.yaml so Chromium and its fonts are present.
    container:
      image: mcr.microsoft.com/playwright:v1.60.0-noble
      options: --ipc=host
    env:
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.E2E_CLERK_PUBLISHABLE_KEY }}
      CLERK_SECRET_KEY: ${{ secrets.E2E_CLERK_SECRET_KEY }}
      CLERK_JWT_ISSUER_DOMAIN: ${{ secrets.E2E_CLERK_JWT_ISSUER_DOMAIN }}
      VITEST_MAX_WORKERS: '4'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10.30.3
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Require dedicated Clerk test tenant
        shell: bash
        run: |
          test -n "$NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY"
          test -n "$CLERK_SECRET_KEY"
          test -n "$CLERK_JWT_ISSUER_DOMAIN"
          [[ "$NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY" == pk_test_* ]]
          [[ "$CLERK_SECRET_KEY" == sk_test_* ]]
      - name: Cache Next build intermediates
        uses: actions/cache@v4
        with:
          path: .next/cache
          key: next-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('src/**', 'convex/**', 'public/**', 'next.config.*', 'tsconfig*.json', 'package.json', 'scripts/**') }}
          restore-keys: |
            next-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pnpm-lock.yaml') }}-
      - name: Cache downloadable Convex backend binaries
        uses: actions/cache@v4
        with:
          # Only binaries/dashboard; private deployment and auth state stay in output/.
          path: ~/.cache/360-tour/convex
          key: convex-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            convex-${{ runner.os }}-${{ runner.arch }}-
      - name: Build and run real-backend E2E with fresh local Convex and real Clerk sign-in
        run: pnpm test:e2e
      - name: Check initial JavaScript budgets on the integration build
        run: pnpm bench:routes --check-budgets

  devcheck:
    # Forks receive no secrets and fail preflight; a skipped job must not imply verification.
    # No pull_request_target or authenticated artifact upload.
    runs-on: ubuntu-24.04
    # Match @playwright/test in pnpm-lock.yaml so Chromium and its fonts are present.
    container:
      image: mcr.microsoft.com/playwright:v1.60.0-noble
      options: --ipc=host
    env:
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.E2E_CLERK_PUBLISHABLE_KEY }}
      CLERK_SECRET_KEY: ${{ secrets.E2E_CLERK_SECRET_KEY }}
      CLERK_JWT_ISSUER_DOMAIN: ${{ secrets.E2E_CLERK_JWT_ISSUER_DOMAIN }}
      VITEST_MAX_WORKERS: '4'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10.30.3
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Require dedicated Clerk test tenant
        shell: bash
        run: |
          test -n "$NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY"
          test -n "$CLERK_SECRET_KEY"
          test -n "$CLERK_JWT_ISSUER_DOMAIN"
          [[ "$NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY" == pk_test_* ]]
          [[ "$CLERK_SECRET_KEY" == sk_test_* ]]
      - name: Cache downloadable Convex backend binaries
        uses: actions/cache@v4
        with:
          # Only binaries/dashboard; private deployment and auth state stay in output/.
          path: ~/.cache/360-tour/convex
          key: convex-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            convex-${{ runner.os }}-${{ runner.arch }}-
      - name: Verify persistent local dev restart, real Clerk and failure cleanup
        run: pnpm test:dev
      # Authenticated state, traces, screenshots and backend logs are intentionally never uploaded.

  verify:
    name: verify
    needs: [static, unit, components, integration, devcheck]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: Require every job to succeed
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          node --input-type=module <<'JS'
          const jobs = JSON.parse(process.env.NEEDS_JSON);
          for (const [name, job] of Object.entries(jobs)) {
            console.log(`${name}: ${job.result}`);
          }
          if (Object.values(jobs).some(job => job.result !== 'success')) process.exit(1);
          JS
