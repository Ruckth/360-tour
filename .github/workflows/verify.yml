name: Verify
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  static:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.5
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: bun install --frozen-lockfile
      - run: bun check
      - run: bun run knip
      - run: bun run arch:score --phase "$(cat .arch-phase)"

  unit:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    env:
      VITEST_MAX_WORKERS: '4'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.5
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: bun install --frozen-lockfile
      - name: Unit, DOM and Convex shard
        run: bun run test:unit --project unit --project dom --project convex --shard=${{ matrix.shard }}/2
      - name: Serial repository guards (once overall)
        if: matrix.shard == 1
        run: bun run test:guards
      - name: Verify one durable write per messaging acknowledgement
        if: matrix.shard == 1
        run: bun run bench:messaging

  components:
    # Booking component suites run against Vite with mocked Clerk and Next: no backend, no credentials.
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.5
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: bun install --frozen-lockfile
      - name: Read installed Playwright version
        id: playwright-version
        # Frozen install resolves this exact version from bun.lock.
        run: node -p '"version=" + require("@playwright/test/package.json").version' >> "$GITHUB_OUTPUT"
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ runner.arch }}-${{ steps.playwright-version.outputs.version }}
      - name: Install Playwright Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: bun run playwright install --with-deps chromium
      - name: Install Playwright system dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: bun run playwright install-deps chromium
      - run: bun run test:booking-ui --shard=${{ matrix.shard }}/2

  integration:
    # Forks receive no secrets and fail preflight; a skipped job must not imply verification.
    # No pull_request_target or authenticated artifact upload.
    runs-on: ubuntu-24.04
    env:
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.E2E_CLERK_PUBLISHABLE_KEY }}
      CLERK_SECRET_KEY: ${{ secrets.E2E_CLERK_SECRET_KEY }}
      CLERK_JWT_ISSUER_DOMAIN: ${{ secrets.E2E_CLERK_JWT_ISSUER_DOMAIN }}
      VITEST_MAX_WORKERS: '4'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.5
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: bun install --frozen-lockfile
      - name: Require dedicated Clerk test tenant
        shell: bash
        run: |
          test -n "$NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY"
          test -n "$CLERK_SECRET_KEY"
          test -n "$CLERK_JWT_ISSUER_DOMAIN"
          [[ "$NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY" == pk_test_* ]] || exit 1
          [[ "$CLERK_SECRET_KEY" == sk_test_* ]] || exit 1
      - name: Read installed Playwright version
        id: playwright-version
        # Frozen install resolves this exact version from bun.lock.
        run: node -p '"version=" + require("@playwright/test/package.json").version' >> "$GITHUB_OUTPUT"
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ runner.arch }}-${{ steps.playwright-version.outputs.version }}
      - name: Install Playwright Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: bun run playwright install --with-deps chromium
      - name: Install Playwright system dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: bun run playwright install-deps chromium
      - name: Cache Next build intermediates
        uses: actions/cache@v4
        with:
          path: .next/cache
          key: next-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('bun.lock', 'bunfig.toml', '.bun-version') }}-${{ hashFiles('src/**', 'convex/**', 'public/**', 'next.config.*', 'tsconfig*.json', 'package.json', 'scripts/**') }}
          restore-keys: |
            next-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('bun.lock', 'bunfig.toml', '.bun-version') }}-
      - name: Cache downloadable Convex backend binaries
        uses: actions/cache@v4
        with:
          # Only binaries/dashboard; private deployment and auth state stay in output/.
          path: ~/.cache/360-tour/convex
          key: convex-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('bun.lock', 'bunfig.toml', '.bun-version') }}
          restore-keys: |
            convex-${{ runner.os }}-${{ runner.arch }}-
      - name: Build and run Next E2E with fresh local Convex and real Clerk sign-in
        run: bun run test:e2e
      - name: Check initial JavaScript budgets on the integration build
        run: bun run bench:routes --check-budgets
      - name: Build and run Start E2E against a fresh seeded backend
        run: bun run test:e2e:start
      - name: Confirm the committed route tree matches the Start build
        run: git diff --exit-code -- src/start-app/routeTree.gen.ts
      - name: Check all four Start initial JavaScript budgets
        run: bun run bench:routes:start
      - name: Verify persistent local dev restart, real Clerk and failure cleanup
        run: bun run test:dev
      # Authenticated state, traces, screenshots and backend logs are intentionally never uploaded.

  verify:
    name: verify
    needs: [static, unit, components, integration]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: Require every job to succeed
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          node --input-type=module <<'JS'
          const jobs = JSON.parse(process.env.NEEDS_JSON);
          for (const [name, job] of Object.entries(jobs)) {
            console.log(`${name}: ${job.result}`);
          }
          if (Object.values(jobs).some(job => job.result !== 'success')) process.exit(1);
          JS
