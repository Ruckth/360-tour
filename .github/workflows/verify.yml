name: Verify
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    # Forks receive no secrets and fail preflight; a skipped job must not imply verification.
    # No pull_request_target or authenticated artifact upload.
    runs-on: ubuntu-24.04
    env:
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.E2E_CLERK_PUBLISHABLE_KEY }}
      CLERK_SECRET_KEY: ${{ secrets.E2E_CLERK_SECRET_KEY }}
      CLERK_JWT_ISSUER_DOMAIN: ${{ secrets.E2E_CLERK_JWT_ISSUER_DOMAIN }}
      VITEST_MAX_WORKERS: '4'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10.30.3
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Require dedicated Clerk test tenant
        shell: bash
        run: |
          test -n "$NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY"
          test -n "$CLERK_SECRET_KEY"
          test -n "$CLERK_JWT_ISSUER_DOMAIN"
          [[ "$NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY" == pk_test_* ]]
          [[ "$CLERK_SECRET_KEY" == sk_test_* ]]
      - run: pnpm arch:score --phase "$(cat .arch-phase)"
      - run: pnpm knip
      - run: pnpm exec eslint . --max-warnings 0
      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Verify with fresh local Convex and real Clerk browser sign-in
        run: pnpm verify:integration
      - name: Verify persistent local dev restart, real Clerk and failure cleanup
        run: pnpm test:dev
      # Authenticated state, traces, screenshots and backend logs are intentionally never uploaded.
